server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: music-catalog-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  itunes:
    base-url: ${ITUNES_API_BASE_URL:https://itunes.apple.com}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
  jiosaavn:
    base-url: ${JIOSAAVN_API_BASE_URL:https://saavn.sumit.co}
  openai:
    api-key: ${OPENAI_API_KEY:your_groq_api_key_here}
    model: ${OPENAI_MODEL:llama-3.1-8b-instant}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your_google_client_id_here}
    client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://music-catlog.vercel.app,https://music-catalog.vercel.app}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.musiccatalog: INFO
    org.springframework.security: INFO
